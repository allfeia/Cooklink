limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=recipes_per_ip:10m rate=5r/m;
limit_conn_zone $server_name zone=recipes_global:10m;

limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    location = /v1/recipes {
        limit_req zone=recipes_per_ip burst=10 nodelay;
        limit_conn recipes_global 20;

        proxy_pass http://backend:8000/v1/recipes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        limit_req zone=api_per_ip burst=30 nodelay;

        proxy_pass http://backend:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
