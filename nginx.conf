# Rate limit ---------------------------------------------------------------
# Этот файл включается внутрь http{} базового образа nginx, поэтому зоны
# limit_req_zone/limit_conn_zone можно объявлять прямо тут, вне server{}.
#
# api_per_ip      — на клиента, все запросы к /v1/* (опрос статуса, отмена, pdf)
# recipes_per_ip  — на клиента, только создание рецепта (самый дорогой путь:
#                   yt-dlp + LLM + Chromium)
# recipes_global  — не по IP, а суммарно на всех — защита от совокупной
#                   перегрузки (см. тест 1: система падает ~480 запр/мин)
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=recipes_per_ip:10m rate=5r/m;
limit_conn_zone $server_name zone=recipes_global:10m;

limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Создание рецепта — самый тяжёлый путь, лимитируем строже и добавляем
    # общий потолок одновременных задач независимо от того, кто их прислал.
    location = /v1/recipes {
        limit_req zone=recipes_per_ip burst=10 nodelay;
        limit_conn recipes_global 20;

        proxy_pass http://backend:8000/v1/recipes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        limit_req zone=api_per_ip burst=30 nodelay;

        proxy_pass http://backend:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
