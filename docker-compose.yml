x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-logging-busy: &busy-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  gotenberg:
    image: gotenberg/gotenberg:8
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    image: postgres:16
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metadata-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.metadata-worker
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 4001
      YOUTUBE_COOKIES_PATH: /app/youtube_cookies.txt
    volumes:
      - ./youtube_cookies.txt:/app/youtube_cookies.txt
    depends_on:
      postgres:
        condition: service_healthy

  subtitles-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.subtitles-worker
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 4002
      YOUTUBE_COOKIES_PATH: /app/youtube_cookies.txt
    volumes:
      - ./youtube_cookies.txt:/app/youtube_cookies.txt
    depends_on:
      postgres:
        condition: service_healthy

  llm-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.llm-worker
    logging: *busy-logging
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 4003
    depends_on:
      postgres:
        condition: service_healthy

  pdf-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.pdf-worker
    logging: *default-logging
    environment:
      GOTENBERG_URL: http://gotenberg:3000
      PORT: 4004
    depends_on:
      - gotenberg

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    logging: *busy-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      METADATA_WORKER_URL: http://metadata-worker:4001
      SUBTITLES_WORKER_URL: http://subtitles-worker:4002
      LLM_WORKER_URL: http://llm-worker:4003
      PDF_WORKER_URL: http://pdf-worker:4004
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      metadata-worker:
        condition: service_started
      subtitles-worker:
        condition: service_started
      llm-worker:
        condition: service_started
      pdf-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health/ready').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    logging: *busy-logging
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  default:
  monitoring:
    driver: bridge
