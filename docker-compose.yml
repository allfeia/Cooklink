services:
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe_generator
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipe_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
